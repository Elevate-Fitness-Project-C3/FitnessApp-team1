
services:
  identityservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=IdentityDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - Email__Smtp__Host=mailhog
      - Email__Smtp__Port=1025
      - Email__From=no-reply@local.test
    ports:
      - "5002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      mailhog:
        condition: service_started

  trainingservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=TrainingDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
    ports:
      - "5003:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is required} 
    ports:
      - "127.0.0.1:11434:1433"
    healthcheck:
      test:
        [
           "CMD-SHELL",
           "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailhog:
    image: mailhog/mailhog
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
